name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: "postgresql://wager:wager@localhost:5432/wager"
      AWS_ENDPOINT: http://localhost:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_QUEUE_URL: http://localhost:4566/000000000000/wager-transactions.fifo
      SQS_DLQ_URL: http://localhost:4566/000000000000/wager-transactions-dlq.fifo
      EVENTS_QUEUE_URL: http://localhost:4566/000000000000/wager-events.fifo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start PostgreSQL and LocalStack
        run: docker compose up -d --wait --wait-timeout 120 postgres localstack

      - name: Apply database migrations
        run: bun run migration:up

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Integration tests
        run: bun run test:integration

      - name: Multi-instance concurrency tests
        run: bun run test:concurrency

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color postgres localstack

      - name: Stop services
        if: always()
        run: docker compose down
